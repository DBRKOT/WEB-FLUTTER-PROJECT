name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Сайт раздаётся из ветки gh-pages, поэтому задача складывает готовую
  # сборку туда. Саму публикацию после этого делает встроенный процесс
  # GitHub «pages build and deployment».
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          API="${API_BASE_URL:-http://127.0.0.1:8090/api}"
          flutter build web --release \
            --base-href /WEB-FLUTTER-PROJECT/ \
            --dart-define=API_BASE_URL="$API"
          cp build/web/index.html build/web/404.html
      - name: Publish to gh-pages
        run: |
          cd build/web
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            gh-pages
