<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Клиент магазина техники ТехноМаркет">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ТехноМаркет">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ТехноМаркет</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f4f6f8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #1a2332;
      z-index: 9999;
    }
    #app-loading .brand {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    #app-loading .hint {
      font-size: 0.95rem;
      color: #5b6573;
    }
    #app-loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #d0d7e2;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #app-loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite" aria-label="Загрузка ТехноМаркет">
    <div class="brand">ТехноМаркет</div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="hint">Загрузка приложения…</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.classList.add('hidden');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
